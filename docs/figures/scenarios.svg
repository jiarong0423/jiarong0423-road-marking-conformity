  <!-- footnotes -->
  <text x="8" y="412" font-size="9.5" fill="#555555">「開框」＝把偵測器自己回傳的框切出來、放大到原解析度打開看。§169 的 25 個判定開了 23 個（未開 F11、F12）；圍籬開了 3 個；§167 開了 1 個。未開框的判定不計為證據。</text>
  <text x="8" y="428" font-size="9.5" fill="#555555">拍攝順序＝行進方向：F05「往樹林」標字字面朝上且遠端為首字；F21–F33 每個箭頭的箭頭端都在遠端；F13–F16 到 F17–F20 走近同一塊槽化線。三者一致。</text>
  <text x="8" y="444" font-size="9.5" fill="#555555">未量測（在照片裡、不在程式裡）：水溝蓋與排水孔、F34 的禁行機車標誌、樹林陸橋 2B-2(A) 引道、§188-1 箭頭間距、F09–F12 漆在路面的速限「30」。</text>
