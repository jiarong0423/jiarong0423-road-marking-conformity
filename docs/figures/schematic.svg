<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 930" width="1400" height="930" font-family="PingFang TC, Noto Sans TC, Helvetica, Arial, sans-serif">
<!-- Schematic drawn by the author, traced from a top-down reprojection of my own photo P64 (lane dashes as the ruler) and, before the cone, a rough one of P62. Widths to scale, about +-10%; lengths along the road compressed; the far-end triangle is measured (results/erased_triangle_P64.json). -->
<style>
 .t{fill:#1b1b1b} .m{fill:#5e5e5a}
 .sm{font-size:12px} .xs{font-size:10.5px} .lbl{font-size:13px;font-weight:700} .hd{font-size:18px;font-weight:700}
 .tt{fill:#0f7b7b} .ta{fill:#c07a1e} .tr{fill:#b03a2e}
</style>
<defs>
 <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
  <rect width="10" height="10" fill="#ffffff"/><rect width="4" height="10" fill="#d9d9d4"/></pattern>
 <pattern id="ghost" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
  <rect width="10" height="10" fill="#7d7d79"/><rect width="4" height="10" fill="#8f8f8a"/></pattern>
 <pattern id="grate" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#3b3b39"/><rect width="4" height="1.4" fill="#9a9a96"/></pattern>
 <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#1b1b1b"/></marker>
</defs>
<rect width="1400" height="760" fill="#fbfbfa"/>
<text x="30" y="38" class="t hd">County Road 116: the painted island, two red lines and seven drain grates</text>
<text x="30" y="60" class="m sm">Traced from my own photos in a top-down view. Widths to scale (lane dashes as the ruler, ±10%); lengths along the road compressed. Google imagery is not used.</text>

<!-- road surface, plan view: widths from my photos, lengths not to scale -->
<rect x="140" y="200" width="1080" height="252.3" fill="#6f6f6b"/>
<line x1="140" y1="224.4" x2="852.8" y2="224.4" stroke="#e8c547" stroke-width="2"/>
<line x1="140" y1="228.7" x2="852.8" y2="228.7" stroke="#e8c547" stroke-width="2"/>
<text x="150" y="248.7" class="xs" fill="#f2f2ee">Main road, same direction: it climbs onto the bridge</text>
<polygon points="852.8,200.0 1220.0,200.0 1220.0,299.2 852.8,299.2" fill="#8d8a83"/>
<rect x="852.8" y="295.2" width="367.2" height="5" fill="#d8d5cc" stroke="#9f9b90" stroke-width="1"/>
<text x="892.8" y="245.2" class="xs" fill="#f2f2ee">Bridge (main road, up)</text>
<line x1="140" y1="350.5" x2="471.2" y2="350.5" stroke="#fff" stroke-width="2.2"/>
<line x1="140" y1="353.1" x2="471.2" y2="353.1" stroke="#fff" stroke-width="2.2"/>
<polygon points="1004.0,299.2 1004.0,335.4 1126.4,299.2" fill="#e0453a" fill-opacity="0.55" stroke="#ff8a7a" stroke-width="1.6" stroke-dasharray="6 3"/>
<polygon points="471.2,351.4 852.8,269.6 852.8,299.2 1004.0,299.2 1004.0,335.4 943.5,353.1 471.2,353.1" fill="url(#hatch)" stroke="#fff" stroke-width="1.8"/>
<line x1="471.2" y1="351.4" x2="852.8" y2="290.5" stroke="#fff" stroke-width="1.6"/>
<polygon points="852.8,281.5 846.8,295.5 858.8,295.5" fill="#f07c2a" stroke="#fff" stroke-width="1"/>
<line x1="1024.2" y1="353.1" x2="1220" y2="353.1" stroke="#f2f2ee" stroke-width="2" stroke-dasharray="20 22"/>
<g transform="translate(644.0,391.4) rotate(0) scale(1.0)" fill="#f2f2ee"><polygon points="-22,-3 6,-3 6,-8 20,0 6,8 6,3 -22,3"/></g>
<g transform="translate(903.2,387.9) rotate(0) scale(1.0)" fill="#f2f2ee"><polygon points="-22,-3 6,-3 6,-8 20,0 6,8 6,3 -22,3"/></g>
<g transform="translate(1040.0,313.1) rotate(0) scale(0.8)" fill="#f2f2ee"><polygon points="-22,-3 6,-3 6,-8 20,0 6,8 6,3 -22,3"/></g>
<g transform="translate(1162.4,394.9) rotate(-30) scale(1.0)" fill="#f2f2ee"><polygon points="-22,-3 6,-3 6,-8 20,0 6,8 6,3 -22,3"/></g>
<text x="183.2" y="377.5" class="xs" fill="#f2f2ee">The rider's lane (about 4.1 m to the asphalt edge) →</text>
<rect x="140" y="424.8" width="1080" height="17.1" fill="#b9b7ae"/>
<rect x="140" y="441.9" width="1080" height="10.4" fill="#d7d4c8" stroke="#a9a69a" stroke-width="1"/>
<line x1="140" y1="424.8" x2="1220" y2="424.8" stroke="#e59a9a" stroke-width="1.6" stroke-dasharray="6 4"/>
<line x1="140" y1="436.1" x2="1220" y2="436.1" stroke="#c0392b" stroke-width="2.4"/>
<g fill="url(#grate)" stroke="#2a2a28" stroke-width=".8"><rect x="178.2" y="430.1" width="10" height="12"/><rect x="286.2" y="430.1" width="10" height="12"/><rect x="394.2" y="430.1" width="10" height="12"/><rect x="502.2" y="430.1" width="10" height="12"/><rect x="610.2" y="430.1" width="10" height="12"/><rect x="718.2" y="430.1" width="10" height="12"/><rect x="826.2" y="430.1" width="10" height="12"/></g>
<g fill="#1b1b1b"><circle cx="399.2" cy="436.1" r="1.8"/><circle cx="442.4" cy="436.1" r="1.8"/><circle cx="507.2" cy="436.1" r="1.8"/></g>
<g class="m xs" text-anchor="middle"><text x="183.2" y="468.3">1</text><text x="291.2" y="468.3">2</text><text x="399.2" y="468.3">3</text><text x="507.2" y="468.3">4</text><text x="615.2" y="468.3">5</text><text x="723.2" y="468.3">6</text><text x="831.2" y="468.3">7</text></g>
<text x="871.2" y="468.3" class="m xs">Grates 1–7 (spacing not to scale)</text>
<!-- callouts top -->
<text x="140" y="104" class="t lbl">① Double white solid line: no changing lanes</text>
<path d="M300,110 L300,344" stroke="#1b1b1b" stroke-width="1" marker-end="url(#a)"/>
<text x="380" y="122" class="t lbl">② The painted island starts and widens</text>
<text x="380" y="144" class="tt sm">Today: white stripes, opening at about 9° (about 6 to 1) near the cone</text>
<text x="380" y="161" class="m xs">Reference (table 4.2.7, 30 km/h): 5 to 1</text>
<path d="M560,181 L560,336" stroke="#1b1b1b" stroke-width="1" marker-end="url(#a)"/>
<text x="760" y="88" class="t lbl">③ The split: a cone, and the bridge wall begins</text>
<path d="M850,94 L852,270" stroke="#1b1b1b" stroke-width="1" marker-end="url(#a)"/>
<text x="880" y="108" class="m xs">Past the cone the stripes run on by the bridge wall and stop at the white line (found by OpenCV).</text>
<text x="880" y="128" class="ta sm">Before (red): the island's end ran on as a triangle, now painted over;</text>
<text x="880" y="145" class="ta sm">about 8.5 m along the wall, 2.1 m wide, 9 m². The left lane's arrow is painted on it.</text>
<text x="880" y="162" class="m xs">Its faint old edge: about 14° to the road (my photo P64, top-down view, ±10%).</text>
<path d="M1060,168 L1050,304" stroke="#c07a1e" stroke-width="1" marker-end="url(#a)"/>
<!-- right margin notes -->
<text x="1230" y="232" class="t lbl">④ Bridge</text>
<text x="1230" y="250" class="m xs">the main road climbs</text>
<text x="1230" y="264" class="m xs">to the left of the wall</text>
<text x="1230" y="368" class="t xs" font-weight="700">After the island:</text>
<text x="1230" y="382" class="m xs">two lanes; the painted</text>
<text x="1230" y="396" class="m xs">arrow says the right lane</text>
<text x="1230" y="410" class="m xs">reduces, merge left</text>
<text x="1230" y="424" class="m xs">(my reading; clause not checked)</text>

<!-- callouts bottom -->
<text x="140" y="590" class="t lbl">⑤ On the right, the red line moved out by 0.63–0.68 m: from the edge of the asphalt (dashed) onto the drain strip (solid)</text>
<text x="140" y="610" class="m sm">The rules say a red line belongs on the kerb, that it marks the outer edge of the road, and that the lane is whatever the markings enclose</text>
<text x="140" y="628" class="m sm">So the new line puts the drain strip and all seven grates inside the road. In all 16 top-down photos (grates 1–6) the new line runs straight across the grate</text>
<text x="140" y="654" class="t lbl">⑥ The Highway Act sets ±0.6 cm flatness for repaired pavement and asks for non-slip surfaces</text>
<text x="140" y="674" class="m sm">I have not measured the step or the grip, and whether that rule covers these grates has not been confirmed</text>
<text x="140" y="700" class="t lbl">⑦ On a scooter: you can't cross left, there is little room to merge, and your right is grates and open drain holes</text>
<text x="140" y="720" class="m sm">On winter mornings the low sun can be in your eyes heading to the bridge (my experience)</text>

<!-- legend -->
<g transform="translate(1230,580)">
 <rect x="0" y="0" width="150" height="158" fill="#ffffff" stroke="#d8d8d4"/>
 <text x="10" y="20" class="t xs" font-weight="700">Key</text>
 <rect x="10" y="30" width="22" height="10" fill="url(#hatch)" stroke="#999"/><text x="38" y="39" class="m xs">Island today</text>
 <rect x="10" y="48" width="22" height="10" fill="#e0453a" fill-opacity="0.55" stroke="#ff8a7a" stroke-dasharray="3 2"/><text x="38" y="57" class="m xs">Painted over</text>
 <line x1="10" y1="72" x2="32" y2="72" stroke="#e59a9a" stroke-width="1.6" stroke-dasharray="6 4"/><text x="38" y="75" class="m xs">Old red line</text>
 <line x1="10" y1="90" x2="32" y2="90" stroke="#c0392b" stroke-width="2.2"/><text x="38" y="93" class="m xs">New red line</text>
 <rect x="16" y="102" width="9" height="9" fill="url(#grate)" stroke="#2a2a28"/><text x="38" y="110" class="m xs">Drain grate</text>
 <rect x="10" y="122" width="22" height="9" fill="#d7d4c8" stroke="#a9a69a"/><text x="38" y="130" class="m xs">Kerb</text>
 <polygon points="21,137 16,147 26,147" fill="#f07c2a"/><text x="38" y="146" class="m xs">Cone</text>
</g>

<!-- cross-section: the layers, in relative widths only. Unit = ground width from the far edge line to the drawn former edge (results/before_taper.json). No metres: nothing of known size is in the photograph. -->
<g transform="translate(0,770)">
 <rect x="30" y="0" width="1340" height="150" rx="6" fill="#ffffff" stroke="#d8d8d4"/>
 <text x="50" y="26" class="t lbl">Across the road at one place: what the old island took (relative widths, not metres)</text>
 <rect x="140" y="52" width="52.8" height="34" fill="url(#hatch)" stroke="#1b1b1b" stroke-width="1"/>
 <rect x="192.8" y="52" width="97.2" height="34" fill="#e0453a" fill-opacity="0.65" stroke="#e0453a" stroke-width="1"/>
 <rect x="290" y="52" width="387" height="34" fill="#9a958a" fill-opacity="0.55" stroke="#6f6a5f" stroke-width="1" stroke-dasharray="6 3"/>
 <path d="M677,69 L720,69" stroke="#6f6a5f" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#a)"/>
 <line x1="140" y1="44" x2="140" y2="96" stroke="#1ba7d6" stroke-width="3"/>
 <line x1="290" y1="44" x2="290" y2="96" stroke="#ff8c00" stroke-width="3"/>
 <text x="140" y="112" class="m xs">far edge line</text>
 <text x="150" y="128" class="ta sm">35% still painted</text>
 <text x="196" y="144" class="tt sm" fill="#e0453a">65% painted over</text>
 <text x="250" y="112" class="m xs">old edge (marked by me)</text>
 <text x="330" y="128" class="m sm">milled road beside it: at least 2.6 island-widths, to the edge of the photo</text>
 <text x="730" y="73" class="m xs">the photograph ends here, so this is a lower bound</text>
 <text x="760" y="112" class="m xs">OpenCV measured the paint, the lines and the ratios. I marked the old edge; the milling is the site owner's statement.</text>
 <text x="760" y="128" class="m xs">OpenCV could not find the old edge or the milled asphalt, and nothing in the photo gives metres.</text>
</g>
</svg>
