<text x="34" y="938" class="t sm">設置規則 §183　劃設紅線處可免設路面邊線 → 紅線即路面外緣</text>
<text x="34" y="958" class="t sm">設計標準 §2(一)　車道＝以標線劃定之道路部分</text>
<text x="34" y="978" class="t sm">設計規範 表 4.2.7　直行車道偏移漸變 30 km/h 5:1、50 km/h 16:1</text>
<text x="34" y="998" class="t sm">公路法 §72 第四項　人手孔蓋回填齊平、抗滑值、3 m 直規 ±0.6 cm</text>
<text x="34" y="1018" class="t sm">新北市道路挖掘作業審查原則 6.0　新舊路面銜接 ±0.6 cm</text>
<text x="34" y="1036" class="m xs">外部 AI 引的設計標準 §14／§16 原文不存在，已排除</text>

