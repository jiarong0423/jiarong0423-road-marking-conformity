<!-- ============ 離線：證據管線 ============ -->
<rect class="zone" x="20" y="612" width="1360" height="248" rx="8"/>
<text x="34" y="632" class="m zh">離線證據管線（isolation/，產出故事的圖；每張圖底都印方法，總表 docs/materials-2026-09-23.md）</text>

<rect class="box" x="34" y="646" width="258" height="200" rx="6"/>
<rect x="34" y="646" width="258" height="4" class="teal" rx="2"/>
<text x="46" y="670" class="t lbl">M1 紅線畫在溝蓋上</text>
<text x="46" y="692" class="m xs">格柵：灰階 &lt; 45 + 形態學閉／開</text>
<text x="46" y="708" class="m xs">+ minAreaRect + 條紋 FFT 週期性</text>
<text x="46" y="724" class="m xs">新紅線：LAB a* + 連通元件 + fitLine</text>
<text x="46" y="740" class="m xs">圓孔：圓度 &gt; 0.6、直徑 5–25 cm</text>
<text x="46" y="768" class="tt sm">16／16 張中軸穿過溝蓋</text>
<text x="46" y="787" class="m xs">距溝蓋中心 1–14 cm，不需比例尺</text>
<text x="46" y="810" class="m xs">09-23 俯拍，溝蓋 1–6</text>
<text x="46" y="830" class="m xs">cv_evidence.py</text>

<rect class="box" x="306" y="646" width="258" height="200" rx="6"/>
<rect x="306" y="646" width="258" height="4" class="teal" rx="2"/>
