<text x="318" y="692" class="m xs">外框：外緣法 + EDLines 兩者一致</text>
<text x="318" y="708" class="m xs">地平線：垂直消失點</text>
<text x="318" y="724" class="m xs">自我檢查：外框 A 要交在車道消失點</text>
<text x="318" y="752" class="tt sm">F40 約 12:1（11.7–12.3）</text>
<text x="318" y="771" class="m xs">7 種擾動 6 次一致，1 次自我檢查剔除</text>
<text x="318" y="794" class="tr xs">F17 拒答：朝陸橋拍，遠端上坡</text>
<text x="318" y="810" class="tr xs">舊的 10:1 撤回（挑到混合線組）</text>
<text x="318" y="830" class="m xs">consensus.py・horizon2.py</text>

<rect class="box" x="578" y="646" width="258" height="200" rx="6"/>
<rect x="578" y="646" width="258" height="4" class="amber" rx="2"/>
