<text x="30" y="38" class="t hd">一張街拍進去，出來的是「量到什麼、量不到什麼、接下來做什麼」</text>
<text x="30" y="60" class="m sm">116 縣道（樹林中正路）・OpenCV 5.0.0 + AWS Lambda（arm64 容器）・2026-09-23</text>

<!-- ============ 線上：endpoint ============ -->
<rect class="zone" x="20" y="78" width="1360" height="520" rx="8"/>
<text x="34" y="98" class="m zh">線上 ENDPOINT（aws/handler.py → src/marking/situation.py:assess）</text>

<!-- 輸入 -->
<rect class="box" x="34" y="112" width="196" height="150" rx="6"/>
<text x="46" y="134" class="t lbl">輸入</text>
<text x="46" y="156" class="m sm">照片 bytes ≤ 3 MB</text>
<text x="46" y="173" class="m xs">原解析度 JPEG q90 約 2.2 MB</text>
<text x="46" y="192" class="m sm">視角 fov_deg</text>
<text x="46" y="211" class="m sm">速限 posted_kmh</text>
<text x="46" y="230" class="m sm">車道寬（選填）</text>
<text x="46" y="248" class="m xs">唯一不是量測的輸入</text>

<!-- 閘門 -->
<rect class="box" x="262" y="112" width="196" height="150" rx="6"/>
<rect x="262" y="112" width="196" height="4" class="red" rx="2"/>
<text x="274" y="136" class="t lbl">幀級閘門</text>
<text x="274" y="158" class="m sm">道路區域 ≥ 30% 才往下</text>
<text x="274" y="178" class="m xs">真實照片 0.555–0.600</text>
<text x="274" y="194" class="m xs">純雜訊 0.000</text>
<text x="274" y="220" class="tr sm">否則 NOT_A_ROAD：</text>
<text x="274" y="237" class="m xs">什麼都不量、要求重拍</text>
<text x="274" y="252" class="m xs">（現場資料仍附上）</text>

<!-- 量測 A：原有檢查 -->
<rect class="box" x="490" y="112" width="262" height="150" rx="6"/>
<rect x="490" y="112" width="262" height="4" class="grey" rx="2"/>
<text x="502" y="136" class="t lbl">原有檢查（計數不可引用）</text>
<text x="502" y="158" class="m sm">雙白 §167／雙黃 §165</text>
<text x="502" y="176" class="m sm">路緣紅線 §169・施工圍籬</text>
<text x="502" y="194" class="m sm">鋪面層數（挖掘審查原則）</text>
<text x="502" y="212" class="m sm">漸變集成（國道守則 L=W·V²/155）</text>
<text x="502" y="236" class="m xs">用途：指出值得打開看的框，</text>
<text x="502" y="251" class="m xs">不是判定那裡有什麼</text>

<!-- 量測 B：新量測 -->
<rect class="box" x="490" y="276" width="262" height="176" rx="6"/>
<rect x="490" y="276" width="262" height="4" class="teal" rx="2"/>
<text x="502" y="300" class="t lbl">新量測（src/marking/phone.py）</text>
<text x="502" y="322" class="tt sm">紅線外移 red_line_gap</text>
<text x="502" y="339" class="m xs">交比 + 消失點；尺＝紅線線寬 10 cm（§169）</text>
<text x="502" y="354" class="m xs">卡片實測新漆線寬 95–97 mm</text>
<text x="502" y="378" class="tt sm">漸變率 taper_table_4_2_7</text>
<text x="502" y="395" class="m xs">槽化線兩條外框的消失點 + 內參 K</text>
<text x="502" y="410" class="m xs">對照表 4.2.7：30 km/h 5:1、50 km/h 16:1</text>
<text x="502" y="436" class="m xs">只在原解析度站得住（2000 px 會拒答）</text>

<!-- 四編碼一致閘 -->
<rect class="box" x="784" y="276" width="212" height="176" rx="6"/>
<rect x="784" y="276" width="212" height="4" class="amber" rx="2"/>
<text x="796" y="300" class="t lbl">四編碼一致閘</text>
<text x="796" y="320" class="m xs">encoding_probe</text>
<text x="796" y="342" class="m sm">原檔 + JPEG q97／94／91</text>
<text x="796" y="360" class="m sm">四次讀數一致才回報</text>
<text x="796" y="380" class="m xs">紅線 ±5 cm、漸變 ±10%</text>
<text x="796" y="404" class="ta xs">起因：F40 原檔 11.9:1，</text>
<text x="796" y="419" class="ta xs">q97 重存一次 23.2:1，跨過 16:1</text>
<text x="796" y="440" class="m xs">不一致 → CANNOT_MEASURE＋原因</text>

<!-- 現場資料 -->
<rect class="box" x="490" y="466" width="506" height="118" rx="6"/>
<rect x="490" y="466" width="506" height="4" class="blue" rx="2"/>
<text x="502" y="490" class="t lbl">116 現場資料（每次都附上，標明「不是從這張照片量的」）</text>
<text x="502" y="512" class="m sm">實線 35 m + 槽化線 50 m = 85 m・七個格柵蓋 8／16／28／44／58／74／82 m（±5 m）</text>
<text x="502" y="531" class="m sm">紅線外移 0.63–0.68 m（F30–32）・30 km/h 可併道 3.4 s（已扣反應 2.5 s）</text>
<text x="502" y="550" class="m sm">漸變率附不穩定註記</text>
<text x="502" y="572" class="m xs">src/marking/site_116.py 由 scripts/build_site_dossier.py 從 results/ 產生；測試比對不一致就失敗</text>

<!-- 輸出 -->
<rect class="box" x="1028" y="112" width="338" height="150" rx="6"/>
<rect x="1028" y="112" width="338" height="4" class="teal" rx="2"/>
<text x="1040" y="136" class="t lbl">輸出 JSON</text>
<text x="1040" y="158" class="m sm">scenario：騎士依序遇到什麼（只用量到的）</text>
<text x="1040" y="177" class="m sm">findings：每項附量測值、條文、狀態</text>
<text x="1040" y="196" class="m sm">red_line_gap・taper_table_4_2_7</text>
<text x="1040" y="215" class="m sm">site_116_not_measured_from_this_photograph</text>
<text x="1040" y="238" class="m xs">狀態：WITHIN／STEEPER_THAN_REFERENCE／</text>
<text x="1040" y="253" class="m xs">INDETERMINATE／CANNOT_MEASURE，一律附 basis</text>

<!-- 下一步 -->
<rect class="box" x="1028" y="276" width="338" height="308" rx="6"/>
<rect x="1028" y="276" width="338" height="4" class="amber" rx="2"/>
<text x="1040" y="300" class="t lbl">接下來做什麼（next_actions）</text>
<text x="1040" y="318" class="m xs">每一項都綁「這張照片的哪件事造成它」</text>
<text x="1040" y="344" class="ta sm">申請文件（量到才出現）</text>
<text x="1040" y="363" class="m xs">・交通局：標線改繪核定函與劃設圖說</text>
<text x="1040" y="380" class="m xs">・許可 1140874494：交維計畫與施工圖說</text>
<text x="1040" y="397" class="m xs">・區公所：側溝竣工圖說與蓋板檢驗報告</text>
<text x="1040" y="422" class="ta sm">查公開紀錄</text>
<text x="1040" y="441" class="m xs">・挖掘許可：750 × 3 m</text>
<text x="1040" y="466" class="ta sm">打開原圖看</text>
<text x="1040" y="485" class="m xs">・§169／§167／§165 命中的框</text>
<text x="1040" y="510" class="ta sm">照片答不了</text>
<text x="1040" y="529" class="m xs">・紅線外移以外的公分數（沒有同深度的尺）</text>
<text x="1040" y="546" class="m xs">・溝蓋：endpoint 內沒有偵測器</text>
<text x="1040" y="570" class="m xs">（離線有，見下方 M1）</text>

