name: tests

# The test suite and the figure check, on every push, with OpenCV 5.0.0.93 and both numpy
# versions in use: 2.4.4 (requirements.txt, what the recorded figures were made with) and
# 2.5.3 (the online service's image, aws/Dockerfile).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        numpy: ["2.4.4", "2.5.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "opencv-python-headless==5.0.0.93" "numpy==${{ matrix.numpy }}" "scipy==1.17.1" "pillow==12.2.0" "pytest==8.3.5"
          python -c "import cv2, numpy; print('opencv', cv2.__version__, 'numpy', numpy.__version__)"
      - name: Tests
        run: python -B -m pytest -q -p no:cacheprovider
      - name: Every published figure against its source
        run: python -B scripts/check_figures.py
